<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title></title>

</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <a href="#"> <img src="img/Gemini_Generated_Image_aem7jgaem7jgaem7.png" alt=""></a>
            </div>
            <div>
                <a href="#">Home</a>
                <a href="#">Menu</a>
                <a href="#">Gallery</a>
                <a href="#">Reservation</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero">   
            <div class="main">
            <h1> Welcome to our Restaurant </h1>
            <p>Enjoy the best food in town</p>
            </div>

            <div class="a">
                <a href="#">Learn More</a>
            </div>
        </section>

        <section class="menu">
            <h3>Our Menu</h3>
            <table>
                <tr>
                    <th>food</th>
                    <th>price</th>
                </tr>
                <tr>
                    <td>Pizza</td>
                    <td>$10</td>
                </tr>
                <tr>
                    <td>Burger</td>
                    <td>$8</td>
                </tr>
                <tr>
                    <td>Pasta</td>
                    <td>$12</td>
                </tr>
            </table>
        </section>
        <section class="Gallery">
            <h3>Food Gallery</h3>
            <div>
                <img src="img/بخخي1.jpg" alt="">
                <img src="img/food3.jpg" alt="">
                <img src="img/food4.jpg" alt="">
            </div>

        </section>
        <section class="Reserve">
            <h3>Reserve a Table</h3>
<div class="reserve-box">
<form>
    
<div class="form-row">
<label for="name">Name:</label>
<input id="name" type="text" name="name">
</div>

<div class="form-row">
<label for="email">Email:</label>
<input id="email" type="email" name="email">
</div>

<div class="form-row">
<label for="date">Date:</label>
<input id="date" type="date" name="date">
</div>

<button class="book-btn">Book Now</button>

</form>
</div>

        </section>
        <section class="Location">
            <h3>Our Location</h3>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2860.258577823764!2d34.466696078184945!3d31.512077180252966!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14fd7f2f9bcf9acf%3A0xe12ef13b4c035b0e!2z2YXZhtiv2Yog2KPYqNmI2K3Yr9mK2K8!5e0!3m2!1sar!2s!4v1772706630865!5m2!1sar!2s"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>


        </section>
